# Gradle and the toolchain only. No CREDENTIAL and no VENUE value belongs in this
# file: credentials live in the git-ignored secrets.properties, and the venue's
# survey lives in the tracked venue.properties next to it.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official
