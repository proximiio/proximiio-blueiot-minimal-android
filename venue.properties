# The venue's survey value. Tracked, and not a credential. It is kept in a file of its
# own rather than in gradle.properties, where it would read as a build flag.
#
# BLUEIOT_GROUND_FLOOR_NO is the engine floor number for the venue's ground floor.
# Proximi.io numbers the ground floor level 0. This venue's LocalSense engine numbers
# floors -1, 1, 2, 3, 4 with no 0, and engine floor -1 is the ground floor, so the value
# is -1. At -1 the SDK shifts the ground floor and the floors below it by one: engine -1
# is level 0, engine -2 is level -1. Engine 1 and above are not shifted. Engine 0
# matches no floor. For an engine that numbers the ground floor 1, set 1: engine 1 is
# level 0, engine 2 is level 1, engine -1 stays level -1. The SDK derives the whole
# number-to-floor table from the venue's own floors; this integer is the single offset
# it cannot derive. Empty or absent means 0: no shift.
BLUEIOT_GROUND_FLOOR_NO=-1
