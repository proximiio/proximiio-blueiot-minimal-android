# The venue's SURVEY — TRACKED, and not a credential. This is the Android twin of
# the iOS Config/App.xcconfig: the one non-secret value the app is built with, kept
# in a file whose name says what it is rather than in gradle.properties, where it
# would read as a build flag.
#
# Which floor number the venue's Blueiot LocalSense engine calls the ground floor.
# Proximi.io calls it level 0; LocalSense deployments are usually numbered from 1,
# and this one is — the relay reports the ground floor as floor 1. The SDK derives
# the whole number-to-storey table from the venue's own floors; this integer is the
# single offset it cannot know, and it goes away when the deployment is renumbered.
# Empty or absent = 0, i.e. the engine numbers storeys exactly the way Proximi.io does.
BLUEIOT_GROUND_FLOOR_NO=1
