# Venue settings that are not credentials. Tracked. They are kept in a file of their own
# rather than in gradle.properties, where they would read as build flags. A value set in
# the git-ignored secrets.properties takes precedence over the value here.
#
# BLUEIOT_RELAY_URL is the relay-api install the app binds wristbands with. The default
# is the Proximi.io sandbox, for development and testing. For the venue, set the venue's
# own relay-api URL, which comes from your Proximi.io contact.
BLUEIOT_RELAY_URL=https://relay-api-sandbox.proximi.fi
