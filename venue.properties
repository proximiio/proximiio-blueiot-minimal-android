# The venue's survey value. Tracked, and not a credential. It is kept in a file of its
# own rather than in gradle.properties, where it would read as a build flag.
#
# BLUEIOT_GROUND_FLOOR_NO is the engine floor number for the venue's ground floor.
# Proximi.io numbers the ground floor level 0. BlueIoT LocalSense deployments are
# usually numbered from 1, and this one is: the relay reports the ground floor as floor
# 1. The SDK derives the whole number-to-floor table from the venue's own floors; this
# integer is the single offset it cannot derive. Empty or absent means 0.
BLUEIOT_GROUND_FLOOR_NO=1
