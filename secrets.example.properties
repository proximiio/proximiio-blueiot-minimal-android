# Template. Copy it to secrets.properties and fill the values in. That copy is
# gitignored (see .gitignore) and is the only place a real value may live. This file is
# tracked and stays empty. The build reads secrets.properties when it exists and leaves
# the values empty when it does not, so a fresh clone still builds and runs.
#
#   cp secrets.example.properties secrets.properties
#
# Credentials only. The venue's survey value, the engine floor number for the ground
# floor, is not secret and is set in the tracked venue.properties instead.

# Proximi.io application token. Proximi.io Portal -> your organisation -> Application
# token. It is a JWT and it is per-customer: never commit it, never paste it into an
# issue.
PROXIMIIO_APPLICATION_TOKEN=

# The Proximi.io cloud relay that carries the venue's wristband positions. A bare host
# is enough; the SDK derives https://... and wss://.../stream from it.
# relay-sandbox.proximi.fi receives journeys played from Proximi.io LiveView
# (live.proximi.fi) and needs its own token below. README, "Testing without the venue".
BLUEIOT_CLOUD_RELAY_URL=blueiot.proximi.fi

# That relay's stream token, sent as `Authorization: Bearer`. Ask your Proximi.io
# contact for it. Without it the relay answers HTTP 401 and no position arrives.
BLUEIOT_CLOUD_RELAY_TOKEN=
