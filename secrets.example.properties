# Template. Copy it to secrets.properties and fill the values in. That copy is
# gitignored (see .gitignore) and is the only place a real value may live. This file is
# tracked and leaves the tokens empty. The build reads secrets.properties when it exists
# and leaves the values empty when it does not, so a fresh clone still builds and runs.
#
#   cp secrets.example.properties secrets.properties

# Proximi.io application token. Proximi.io Portal -> your organisation -> Application
# token. It is a JWT and it is per-customer: never commit it, never paste it into an
# issue.
PROXIMIIO_APPLICATION_TOKEN=

# The relay-api install the app binds wristbands with.
#   Sandbox, for development and testing:   https://relay-api-sandbox.proximi.fi
#   Production: the venue's own relay-api URL, from your Proximi.io contact.
# The tracked venue.properties sets the sandbox as the default.
BLUEIOT_RELAY_URL=https://relay-api-sandbox.proximi.fi

# The relay-api app token of that install, sent as `Authorization: Bearer` on a
# wristband bind. Each install has its own token; obtain it from your Proximi.io
# contact. Without a valid token every bind fails with "app token rejected".
BLUEIOT_RELAY_APP_TOKEN=
